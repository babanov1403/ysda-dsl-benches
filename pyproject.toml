[project]
name = "ysda-dsl"
version = "0.1.0"
description = "GPU kernel benchmarks with PyTorch, Triton, CuTe DSL and CUDA C++"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.14.1",
    "triton==3.8.0",
    "nvidia-cutlass-dsl[cu13]==4.8.1",
    "numpy==2.5.4",
    "matplotlib==3.11.2",
    "ninja==1.13.2",
    "jupyterlab==4.6.5",
    "ipykernel==7.4.0",
    "tilelang==0.1.15",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
